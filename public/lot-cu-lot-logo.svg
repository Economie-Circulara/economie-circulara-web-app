<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 35 825 310" fill="none" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Lot cu Lot</title>
  <desc id="logo-desc">Wordmark verde-petrol cu doua inele unite printr-un traseu circular verde-lime.</desc>
  <style>
    .wordmark {
      fill: #0b4f4a;
      font-family: Montserrat, "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
      font-size: 164px;
      font-weight: 700;
      letter-spacing: -5px;
    }
    .route {
      fill: none;
      stroke: #b7e33d;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark {
        fill: #e8f4ef;
      }
      .ring {
        stroke: #e8f4ef;
      }
    }

    .dot {
      transform-box: fill-box;
      transform-origin: center;
    }

    .route {
      stroke-dasharray: 100;
      animation: route-draw 12s ease-in-out infinite;
    }
    .arrow {
      fill: #b7e33d;
      opacity: 0;
      offset-rotate: auto;
      animation: arrow-move 12s ease-in-out infinite;
    }
    /* Fiecare sageata foloseste bucla completa (traseul propriu + traseul
       partenerei), pornind si terminand in acelasi inel: tur 1 deseneaza
       traseul propriu (jumatate din bucla), tur 2 continua pe traseul deja
       desenat de cealalta sageata si se opreste exact in centrul inelului
       de plecare. */
    #arrow-top {
      offset-path: path("M191 192v-90q0-36 36-36h440q36 0 36 36v90v90q0 36-36 36H227q-36 0-36-36v-90");
    }
    #arrow-bottom {
      offset-path: path("M703 192v90q0 36-36 36H227q-36 0-36-36v-90v-90q0-36 36-36h440q36 0 36 36v90");
    }
    .dot {
      animation: dot-pulse 12s ease-in-out infinite;
    }

    @keyframes route-draw {
      0%, 47.9% { stroke-dashoffset: 100; opacity: 1; }
      48% { stroke-dashoffset: 100; opacity: 1; }
      60% { stroke-dashoffset: 0; opacity: 1; }
      75% { stroke-dashoffset: 0; opacity: 1; }
      81% { stroke-dashoffset: 0; opacity: 0; }
      81.1%, 100% { stroke-dashoffset: 100; opacity: 0; }
    }

    /* offset-distance tine pasul cu stroke-dashoffset de mai sus (acelasi interval
       48%-60%, acelasi easing) cat timp sageata deseneaza traseul propriu (0%-50%
       din bucla completa); intre 60%-72% continua pe traseul deja desenat de
       partenera (al doilea tur) pana se opreste fix in centrul inelului propriu
       (100% din bucla). */
    @keyframes arrow-move {
      0%, 47.9% { offset-distance: 0%; opacity: 0; }
      48% { offset-distance: 0%; opacity: 1; }
      60% { offset-distance: 50%; opacity: 1; }
      72% { offset-distance: 100%; opacity: 1; }
      75% { offset-distance: 100%; opacity: 1; }
      81% { offset-distance: 100%; opacity: 0; }
      81.1%, 100% { offset-distance: 0%; opacity: 0; }
    }

    @keyframes dot-pulse {
      0%, 44% { transform: scale(1); filter: none; }
      47% { transform: scale(1.25); filter: drop-shadow(0 0 6px #b7e33d); }
      52% { transform: scale(1.05); filter: drop-shadow(0 0 3px #b7e33d); }
      60%, 75% { transform: scale(1); filter: none; }
      100% { transform: scale(1); filter: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .route, .arrow, .dot {
        animation: none !important;
      }
      .route {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      .arrow {
        offset-distance: 100%;
        opacity: 1;
      }
    }
  </style>

  <g id="trace-loop">
    <path class="route" pathLength="100" d="M191 192v-90q0-36 36-36h440q36 0 36 36v90" />
    <path id="arrow-top" class="arrow" d="M-13.5,-21 13.5,0 -13.5,21 Z" />
    <path class="route" pathLength="100" d="M703 192v90q0 36-36 36H227q-36 0-36-36v-90" />
    <path id="arrow-bottom" class="arrow" d="M-13.5,-21 13.5,0 -13.5,21 Z" />
  </g>

  <g id="wordmark" aria-label="lot cu lot">
    <text class="wordmark" x="79" y="250">l</text>
    <g transform="translate(191 192)">
      <circle class="ring" r="48" stroke="#0b4f4a" stroke-width="20" />
      <circle id="dot-left" class="dot" r="20" fill="#b7e33d" />
    </g>
    <text class="wordmark" x="259" y="250">t</text>
    <text class="wordmark" x="368" y="250">cu</text>
    <text class="wordmark" x="591" y="250">l</text>
    <g transform="translate(703 192)">
      <circle class="ring" r="48" stroke="#0b4f4a" stroke-width="20" />
      <circle id="dot-right" class="dot" r="20" fill="#b7e33d" />
    </g>
    <text class="wordmark" x="771" y="250">t</text>
  </g>
</svg>
